name: Release

# A push to main cuts a release, but only when package.json's `version` changes.
# Ordinary pushes (docs, fixes without a bump) are a no-op, so this is safe to
# leave enabled. See "Publishing" in the README for how to arm it.
on:
  push:
    branches: [main]
  # Lets you cut a release from the Actions tab without pushing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide whether this commit should release. Kept separate so the reason for
  # skipping shows up in the job summary instead of being buried in a log.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to know what's already released

      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          is_private=$(node -p "require('./package.json').private === true")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$is_private" = "true" ]; then
            echo "::notice::Releases are disabled: package.json has \"private\": true. Remove it to arm publishing."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::Tag v$version already exists — no version bump, nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Releasing $name@$version"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes are built from the log since the last tag

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm (not bun) does the publish: it handles auth tokens and the npm
      # registry's quirks more predictably. registry-url wires NODE_AUTH_TOKEN in.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # --ignore-scripts skips node-pty's node-gyp rebuild. We publish plain JS;
      # the native binary is compiled on the user's machine at install time, so
      # building it here is wasted work that only adds a way for the job to fail.
      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run typecheck

      - run: bun run build

      - name: Fail early if the publish token is missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add an npm automation token: gh secret set NPM_TOKEN"
            exit 1
          fi

      # --access public is required for scoped names (@scope/pkg default to
      # private) and is a harmless no-op for unscoped ones, so it works whichever
      # name you settle on. --provenance is omitted: it requires a public repo.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Notes come from the commit log, not from `gh --generate-notes`: that one
      # only lists merged PRs, and this repo is pushed to directly, so it would
      # produce an empty changelog.
      - name: Build the release notes from the commit history
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            echo "Collecting commits in $range"
          else
            range="HEAD"
            echo "No previous v* tag — using the full history."
          fi

          # --no-merges: merge commits carry no content of their own.
          commits=$(git log --no-merges --reverse \
            --format='- %s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))' "$range")

          {
            echo "## What's changed"
            echo
            # Can happen if the tag lands on a commit already covered by the last release.
            echo "${commits:-_No commits since the previous release._}"
            echo
            if [ -n "$prev" ]; then
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$prev...v$VERSION"
            fi
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md
